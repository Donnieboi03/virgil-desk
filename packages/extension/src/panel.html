<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header>
      <h1>Virgil Desk</h1>
      <div class="handoff-intent" id="handoff-intent">
        <button type="button" class="intent-chip active" data-intent="all visible" title="Triage what’s on screen">
          All visible
        </button>
        <button type="button" class="intent-chip" data-intent="this item" title="Focus on one thing in view">
          This item
        </button>
        <input
          id="intent-extra"
          type="text"
          placeholder="Optional detail (subject, URL fragment…)"
          autocomplete="off"
        />
      </div>
      <button id="handoff">Hand off this tab</button>
    </header>
    <div id="status-strip" class="status-strip">
      <span id="host-status">Host …</span>
      <span id="ws-status">WS …</span>
      <span id="backend-status"></span>
    </div>
    <div id="decomposition" class="decomposition hidden"></div>
    <div id="last-handoff" class="last-handoff hidden">
      <span>Run</span>
      <code id="run-id"></code>
      <button id="copy-run-id" type="button">Copy</button>
    </div>
    <div id="handoff-error" class="error hidden"></div>
    <div class="columns">
      <section><h2>You</h2><ul id="col-you"></ul></section>
      <section class="col-agent-section">
        <div class="col-header">
          <h2>Agent</h2>
          <button id="run-tab" type="button" class="run-tab-btn" disabled title="Run all proposed Agent tasks in one session">
            Run tab
          </button>
          <button id="cancel-tab" type="button" class="run-tab-btn secondary hidden" title="Cancel Run tab">
            Cancel
          </button>
        </div>
        <p id="run-tab-status" class="run-tab-status hidden"></p>
        <ul id="col-agent"></ul>
      </section>
      <section><h2>Waiting</h2><ul id="col-waiting"></ul></section>
    </div>
    <script type="module" src="panel.js"></script>
  </body>
</html>
