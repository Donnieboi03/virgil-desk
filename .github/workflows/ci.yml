name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install
      - run: npm run build -w @virgil-desk/protocol
      - run: npm run test -w @virgil-desk/protocol
      - run: npm run build -w @virgil-desk/extension
      - run: cd packages/extension/dist && zip -r ../../extension-dist.zip .
      - run: npm run test -w @virgil-desk/extension
      - run: npm run validate:schema
      - run: pip install -e "./packages/host[dev]"
      - run: pytest packages/host/tests packages/e2e -q
      - run: cd packages/e2e/playwright && npm install && npx playwright install chromium
      - run: cd packages/e2e/playwright && xvfb-run npm test || npm test
      - uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: packages/extension-dist.zip
