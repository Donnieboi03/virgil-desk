browser:
  scrape_text_max_chars: 16000
  scrape_links_max: 200
  scrape_excerpt_max_chars: 8000
  handoff_excerpt_max_chars: 8000
  handoff_scroll_loops: 2
  screenshot_mode: captureVisibleTab
