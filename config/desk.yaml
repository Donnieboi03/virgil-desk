browser:
  scrape_text_max_chars: 100000
  scrape_links_max: 200
  scrape_excerpt_max_chars: 12000
  handoff_excerpt_max_chars: 12000
  handoff_scroll_loops: 2
  handoff_scroll_viewport_ratio: 0.85
  screenshot_mode: captureVisibleTab
  screenshot_max_per_run: 40
  default_wait_ms: 500
  interact_targets_max: 80
  observe_annotate_default: true
  act_stall_max: 3
  observe_followup_excerpt_max_chars: 4000
  observe_skip_screenshot_default: true
  observe_all_frames: true
  page_tree_max_chars: 8000
  page_tree_max_nodes: 400
  # execute browser ops: extension (Path B) | harness (CDP rollback)
  driver: extension
  harness_bin: browser-harness
  harness_bu_name: virgil-desk
host:
  browser_wait_timeout_sec: 30
hermes:
  decompose_timeout_sec: 120
  execute_timeout_sec: 240
  execute_require_browser_evidence: true
  decompose_fallback_stub: true
  decompose_enabled: true
  decompose_model: google/gemini-3.1-flash-lite
  execute_model: google/gemini-3.7-flash
  execute_toolsets:
    - terminal
    - skills
  execute_accept_hooks: false
  execute_max_turns: 20
observability:
  persist_screenshots: false
memory:
  recent_max: 3
  notepad_max_bullets: 20
  notepad_max_chars: 4000
prompts:
  decompose_items_max: 10
  decompose_summary_sentences_max: 3
  work_item_title_max_chars: 200
  execute_summary_max_chars: 2000
  event_snippet_max_chars: 500
  event_summary_snippet_max_chars: 200
  thin_scrape_threshold_chars: 200
  agent_scroll_stall_loops: 2
